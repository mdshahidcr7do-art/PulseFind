<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Provider dashboard — PulseFind</title>
<link rel="stylesheet" href="css/style.css">
<style>
  .dash-head {
    background: var(--navy);
    padding: 1.75rem 1.5rem 2rem;
  }
  .dash-head-inner { max-width: 760px; margin: 0 auto; }
  .dash-head .pharmacy-name {
    color: var(--white);
    font-size: 1.5rem;
  }
  .dash-head .pharmacy-area {
    color: rgba(247, 244, 236, 0.65);
    font-size: 0.9rem;
    margin-top: 0.2rem;
  }

  .stat-row {
    display: flex;
    gap: 1.5rem;
    margin-top: 1.25rem;
  }
  .stat {
    background: rgba(247, 244, 236, 0.07);
    border-radius: 8px;
    padding: 0.7rem 1rem;
  }
  .stat .num {
    font-family: var(--serif);
    font-size: 1.4rem;
    font-weight: 700;
    color: var(--gold-light);
  }
  .stat .label {
    color: rgba(247, 244, 236, 0.65);
    font-size: 0.78rem;
  }

  .wide-container { max-width: 760px; margin: 0 auto; padding: 1.75rem 1.25rem 3rem; }

  .add-form {
    display: flex;
    gap: 0.6rem;
    margin-bottom: 1.75rem;
  }
  .add-form input { flex: 1; }
  .add-form button {
    background: var(--gold);
    color: var(--navy);
    font-weight: 600;
    padding: 0 1.3rem;
    border-radius: 8px;
  }
  .add-form button:hover { background: var(--gold-light); }

  .inv-row {
    background: var(--white);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 1rem 1.2rem;
    margin-bottom: 0.7rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
    flex-wrap: wrap;
  }
  .inv-row .info { min-width: 160px; }
  .inv-row .med-name { font-weight: 600; font-size: 1rem; }
  .inv-row .updated { color: var(--muted); font-size: 0.8rem; margin-top: 0.1rem; }

  .status-toggle {
    display: inline-flex;
    background: var(--cream);
    border-radius: 8px;
    padding: 0.2rem;
    gap: 0.15rem;
  }
  .status-toggle button {
    border: none;
    background: transparent;
    font-size: 0.8rem;
    font-weight: 500;
    padding: 0.5rem 0.75rem;
    border-radius: 6px;
    cursor: pointer;
    color: var(--muted);
  }
  .status-toggle button.active-ok { background: var(--stock-ok); color: var(--white); }
  .status-toggle button.active-low { background: var(--stock-low); color: var(--white); }
  .status-toggle button.active-out { background: var(--stock-out); color: var(--white); }

  .remove-btn {
    border: none;
    background: transparent;
    color: var(--muted);
    font-size: 1.1rem;
    cursor: pointer;
    padding: 0.2rem 0.4rem;
    line-height: 1;
  }
  .remove-btn:hover { color: var(--stock-out); }

  .section-title {
    font-size: 1.05rem;
    color: var(--navy-ink);
    margin-bottom: 0.9rem;
  }
</style>
</head>
<body>

  <div class="topbar">
    <a href="index.html" class="brand">PulseFind</a>
    <nav>
      <a href="search.html">Search</a>
      <a href="login.html">Sign out</a>
    </nav>
  </div>

  <header class="dash-head">
    <div class="dash-head-inner">
      <h1 class="pharmacy-name" id="pharmacy-name">Loading…</h1>
      <p class="pharmacy-area" id="pharmacy-area"></p>
      <div class="stat-row">
        <div class="stat"><p class="num" id="stat-total">6</p><p class="label">Medicines listed</p></div>
        <div class="stat"><p class="num" id="stat-instock">4</p><p class="label">In stock</p></div>
        <div class="stat"><p class="num" id="stat-out">1</p><p class="label">Out of stock</p></div>
      </div>
    </div>
  </header>

  <main class="wide-container">
    <p class="section-title">Add a medicine</p>
    <form class="add-form" id="add-form">
      <input type="text" id="new-med" placeholder="e.g. Amoxicillin 500" required>
      <button type="submit">Add</button>
    </form>

    <p class="section-title">Your inventory — tap a status to update it</p>
    <div id="inventory-list"></div>
  </main>

  <p class="footer-note">Built for Innovik 6.0 by Team PulseCode</p>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="js/firebase-config.js"></script>

  <script>
    const list = document.getElementById('inventory-list');
    let currentUid = null;
    let inventory = []; // each item: { id, name, status, updatedAt }
    let unsubscribeInventory = null;

    function timeAgo(timestamp) {
      if (!timestamp) return 'Just added';
      const seconds = Math.floor((Date.now() - timestamp.toDate().getTime()) / 1000);
      if (seconds < 60) return 'Updated just now';
      const minutes = Math.floor(seconds / 60);
      if (minutes < 60) return `Updated ${minutes} min ago`;
      const hours = Math.floor(minutes / 60);
      if (hours < 24) return `Updated ${hours} hr ago`;
      const days = Math.floor(hours / 24);
      if (days === 1) return 'Updated yesterday';
      return `Updated ${days} days ago`;
    }

    function render() {
      list.innerHTML = '';
      if (inventory.length === 0) {
        list.innerHTML = '<p style="color: var(--muted); font-size: 0.9rem;">No medicines added yet — add your first one above.</p>';
      }
      inventory.forEach((item) => {
        const row = document.createElement('div');
        row.className = 'inv-row';
        row.innerHTML = `
          <div class="info">
            <p class="med-name">${item.name}</p>
            <p class="updated">${timeAgo(item.updatedAt)}</p>
          </div>
          <div class="status-toggle" data-id="${item.id}">
            <button data-status="ok" class="${item.status === 'ok' ? 'active-ok' : ''}">In stock</button>
            <button data-status="low" class="${item.status === 'low' ? 'active-low' : ''}">Low</button>
            <button data-status="out" class="${item.status === 'out' ? 'active-out' : ''}">Out</button>
          </div>
          <button class="remove-btn" data-remove="${item.id}" aria-label="Remove ${item.name}">&times;</button>
        `;
        list.appendChild(row);
      });
      updateStats();
    }

    function updateStats() {
      document.getElementById('stat-total').textContent = inventory.length;
      document.getElementById('stat-instock').textContent = inventory.filter(i => i.status === 'ok').length;
      document.getElementById('stat-out').textContent = inventory.filter(i => i.status === 'out').length;
    }

    list.addEventListener('click', (e) => {
      const btn = e.target.closest('button');
      if (!btn || !currentUid) return;

      if (btn.dataset.remove !== undefined) {
        db.collection('inventory').doc(btn.dataset.remove).delete()
          .catch((err) => alert('Could not remove item: ' + err.message));
        return;
      }

      if (btn.dataset.status) {
        const id = btn.closest('.status-toggle').dataset.id;
        db.collection('inventory').doc(id).update({
          status: btn.dataset.status,
          updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
        }).catch((err) => alert('Could not update status: ' + err.message));
      }
    });

    document.getElementById('add-form').addEventListener('submit', (e) => {
      e.preventDefault();
      if (!currentUid) return;
      const input = document.getElementById('new-med');
      const name = input.value.trim();
      if (!name) return;

      db.collection('inventory').add({
        pharmacyId: currentUid,
        name,
        status: 'ok',
        updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
      }).then(() => { input.value = ''; })
        .catch((err) => alert('Could not add medicine: ' + err.message));
    });

    function loadInventory(uid) {
      if (unsubscribeInventory) unsubscribeInventory();
      unsubscribeInventory = db.collection('inventory')
        .where('pharmacyId', '==', uid)
        .onSnapshot((snapshot) => {
          inventory = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
          inventory.sort((a, b) => a.name.localeCompare(b.name));
          render();
        }, (err) => {
          console.error('Inventory listener error:', err);
        });
    }

    auth.onAuthStateChanged((user) => {
      if (!user) {
        window.location.href = 'login.html';
        return;
      }

      db.collection('users').doc(user.uid).get().then((doc) => {
        if (!doc.exists || doc.data().role !== 'pharmacy') {
          window.location.href = doc.exists && doc.data().role === 'donor' ? 'donor.html' : 'login.html';
          return;
        }

        currentUid = user.uid;

        return db.collection('pharmacies').doc(user.uid).get().then((pharmacyDoc) => {
          if (pharmacyDoc.exists) {
            const data = pharmacyDoc.data();
            document.getElementById('pharmacy-name').textContent = data.name || 'Your pharmacy';
            document.getElementById('pharmacy-area').textContent = data.area || '';
          }
          loadInventory(user.uid);
        });
      }).catch((err) => {
        console.error('Failed to load profile:', err);
      });
    });
  </script>

</body>
</html>
